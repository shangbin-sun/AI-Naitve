[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-project-factory"
version = "0.1.0"
description = "AI Project Factory — conversational team design and employee development"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.20,<2",
  "Pillow>=11,<13",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic>=2.10,<3",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]


[tool.setuptools.package-data]
app = ["skills/*/SKILL.md"]
